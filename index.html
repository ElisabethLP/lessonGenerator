<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор Урока</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Конструктор Урока</h1>
    </header>

    <main>
        <!-- ========== ГЕНЕРАЦИЯ ========== -->
        <section id="generator-section">
            <button id="generate-button">Создать структуру урока</button>

            <div id="lesson-structure-container"></div>

            <!-- Кнопки действий: появляются только после первой генерации -->
            <div id="result-actions" style="display: none;">
                <button id="copy-button">📋 Копировать</button>
                <button id="regenerate-button">🎲 Сгенерировать заново</button>
                <p class="hint">Не подошло? Попробовать снова</p>
            </div>
        </section>

        <!-- ========== ВСЕ ПРИЁМЫ С ФИЛЬТРАМИ ========== -->
        <section id="all-techniques-section">
            <h2>Все приёмы</h2>

            <div class="filters">
                <button class="filter-btn active" data-category="all">Все</button>
                <button class="filter-btn" data-category="актуализация">Актуализация</button>
                <button class="filter-btn" data-category="основной этап">Основной этап</button>
                <button class="filter-btn" data-category="закрепление">Закрепление</button>
                <button class="filter-btn" data-category="физкультминутка">Физкультминутка</button>
                <button class="filter-btn" data-category="рефлексия">Рефлексия</button>
            </div>

            <button id="show-all-button">Показать все приёмы</button>

            <!-- Кнопка закрытия сверху: появляется только когда список открыт -->
            <div id="close-list-wrapper" style="display: none;">
                <button id="hide-all-button">↑ Скрыть список</button>
            </div>

            <div id="all-techniques-container" style="display: none;"></div>
        </section>

        <!-- ========== ДОБАВЛЕНИЕ ПРИЁМА ========== -->
        <section id="add-technique-section">
            <h2>Добавить свой приём</h2>
            <button id="show-add-form-button">Добавить новый приём</button>

            <form id="add-technique-form" style="display: none;">
                <label for="technique-name">Название приёма:</label>
                <input type="text" id="technique-name" required>

                <label for="technique-category">Категория:</label>
                <select id="technique-category" required>
                    <option value="">— Выберите категорию —</option>
                    <option value="актуализация">Актуализация</option>
                    <option value="основной этап">Основной этап</option>
                    <option value="закрепление">Закрепление</option>
                    <option value="физкультминутка">Физкультминутка</option>
                    <option value="рефлексия">Рефлексия</option>
                </select>

                <label for="technique-description">Описание:</label>
                <textarea id="technique-description"></textarea>

                <button type="submit">Сохранить приём</button>
                <button type="button" id="cancel-add-button">Отмена</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 Индивидуальный проект Ложичевой Е.П.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
